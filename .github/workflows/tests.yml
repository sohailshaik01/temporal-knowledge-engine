name: Contract regression tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile submission/solution.py submission/facts.py tests/test_temporal.py
      - name: Run synthetic regression tests
        run: python tests/test_temporal.py
